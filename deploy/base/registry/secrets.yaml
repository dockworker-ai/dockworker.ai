# LOR-511 — htpasswd + registry config.yml (S3 driver -> Cloudflare R2)
# !! PLACEHOLDERS: replace before applying.
#   - htpasswd: generate with `htpasswd -nbB free-runner <TOKEN>=32chars>` and base64 the file
#   - R2 creds below go in dockworker-registry-r2-creds (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
apiVersion: v1
kind: Secret
metadata:
  name: dockworker-registry-htpasswd
  namespace: dockworker-system
type: Opaque
stringData:
  htpasswd: |
    free-runner:__BCRYPT_HTPASSWD_ENTRY__
---
apiVersion: v1
kind: Secret
metadata:
  name: dockworker-registry-config
  namespace: dockworker-system
type: Opaque
stringData:
  config.yml: |
    version: 0.1
    log:
      level: info
      formatter: json
      fields:
        service: registry
      accesslog:
        disabled: true
    storage:
      cache:
        blobdescriptor: inmemory
      s3:
        region: auto
        regionendpoint: https://f1be33af27cf878e2e81cb29a0d886f7.r2.cloudflarestorage.com
        bucket: dockworker-free-registry
        rootdirectory: /registry
        encrypt: false
        secure: true
        v4auth: true
        chunksize: 5242880
        s3ForcePathStyle: true
      redirect:
        disable: false
    auth:
      htpasswd:
        realm: dockworker-registry
        path: /etc/docker/registry/auth/htpasswd
    http:
      addr: :5000
      headers:
        X-Content-Type-Options: [nosniff]
---
apiVersion: v1
kind: Secret
metadata:
  name: dockworker-registry-r2-creds
  namespace: dockworker-system
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: __R2_ACCESS_KEY_ID__
  AWS_SECRET_ACCESS_KEY: __R2_SECRET_ACCESS_KEY__
