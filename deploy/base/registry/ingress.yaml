# LOR-512 — Ingress: proxy-body-size "0" for large OCI blobs, 600s timeouts
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dockworker-registry-ingress
  namespace: dockworker-system
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - registry.dockworker.ai
      secretName: registry-dockworker-ai-tls
  rules:
    - host: registry.dockworker.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dockworker-registry-svc
                port:
                  number: 5000