# Cloudflare Tunnel Daemon for Zero-Egress OCI Registry (dockworker-registry)
# Tunnel ID: 05f4f044-ad79-4b36-a2ab-4a41ab520d3f
# Ingress: registry.dockworker.ai -> http://dockworker-registry-svc.dockworker-system.svc.cluster.local:5000
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-dockworker-registry-token
  namespace: dockworker-system
type: Opaque
stringData:
  TUNNEL_TOKEN: "eyJhIjoiZjFiZTMzYWYyN2NmODc4ZTJlODFjYjI5YTBkODg2ZjciLCJ0IjoiMDVmNGYwNDQtYWQ3OS00YjM2LWEyYWItNGE0MWFiNTIwZDNmIiwicyI6Ilg3S0JSL01LZm5MT0RxQmxPTTl4TlZMZm9oT0xPMXA5U0dsWjMraHovdEpRVzlZU1ZNVzQwKy9XTWgySVdyellsVFFBU1FKWEFOamphWDI0VVJldjV3PT0ifQ=="
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-dockworker-registry
  namespace: dockworker-system
  labels:
    app: cloudflared-dockworker-registry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-dockworker-registry
  template:
    metadata:
      labels:
        app: cloudflared-dockworker-registry
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2024.10.0
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-dockworker-registry-token
                  key: TUNNEL_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
