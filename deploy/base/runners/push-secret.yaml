# LOR-513 — dockworker-free-push-token in dockworker-runners
# !! PLACEHOLDER: TOKEN must be >= 32 chars, matching the htpasswd entry from LOR-511.
# Generate at apply time:
#   TOKEN='<32+ char token>'
#   AUTH=$(printf 'free-runner:%s' "$TOKEN" | base64 -w0)
#   DOCKERCONFIG=$(printf '{"auths":{"registry.dockworker.ai":{"username":"free-runner","password":"%s","auth":"%s"}}}' "$TOKEN" "$AUTH" | base64 -w0)
# then fill .dockerconfigjson below.
apiVersion: v1
kind: Secret
metadata:
  name: dockworker-free-push-token
  namespace: dockworker-runners
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: __BASE64_DOCKERCONFIGJSON__