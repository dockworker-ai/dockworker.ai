# LOR-514 — dockworker-probe-001 verification gate job
# Self-contained: kaniko initContainer builds + pushes a trivial image
# (layer blobs land in R2); main container verifies the digest with crane.
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-dockerfile
  namespace: dockworker-runners
data:
  Dockerfile: |
    FROM busybox:1.36
    RUN echo "dockworker-probe-001" > /probe.txt
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dockworker-probe-001
  namespace: dockworker-runners
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: dockworker-free-push-token
      initContainers:
        - name: kaniko-build-push
          image: gcr.io/kaniko-project/executor:v1.23.2
          args:
            - --dockerfile=/workspace/Dockerfile
            - --context=dir:///workspace
            - --destination=registry.dockworker.ai/probe/dockworker-probe-001:latest
            - --insecure=false
          volumeMounts:
            - name: dockerfile
              mountPath: /workspace/Dockerfile
              subPath: Dockerfile
              readOnly: true
            - name: docker-config
              mountPath: /kaniko/.docker/config.json
              subPath: .dockerconfigjson
              readOnly: true
      containers:
        - name: verify-digest
          image: gcr.io/go-containerregistry/crane:debug
          env:
            - name: DOCKER_CONFIG
              value: /root/.docker
          command:
            - /bin/sh
            - -c
            - |
              set -e
              DIGEST=$(crane digest registry.dockworker.ai/probe/dockworker-probe-001:latest)
              echo "probe image digest: $DIGEST"
              test -n "$DIGEST"
          volumeMounts:
            - name: docker-config
              mountPath: /root/.docker/config.json
              subPath: .dockerconfigjson
              readOnly: true
      volumes:
        - name: dockerfile
          configMap:
            name: probe-dockerfile
        - name: docker-config
          secret:
            secretName: dockworker-free-push-token
