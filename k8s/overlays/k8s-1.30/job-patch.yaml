apiVersion: batch/v1
kind: Job
metadata:
  name: dockworker-build
spec:
  template:
    spec:
      hostUsers: false  # K8s 1.30+ native user namespace isolation
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
