apiVersion: batch/v1
kind: Job
metadata:
  name: dockworker-build
spec:
  template:
    metadata:
      annotations:
        # Fallback isolation for pre-1.30 clusters
        container.apparmor.security.beta.kubernetes.io/builder: runtime/default
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        seLinuxOptions:
          level: "s0:c123,c456"  # Unique per pod for isolation
