apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dockworker-egress-policy
  namespace: dockworker-runners
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: build-runner
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # No inbound traffic allowed to build pods
    - from: []
  egress:
    # Allow DNS queries for image registry lookups
    - to:
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow HTTPS to container registries (Docker Hub, GHCR, etc.)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    # Allow HTTP for image pulls (legacy registries)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80
    # Allow egress to Kubernetes API (for secrets, etc. if needed)
    - to:
        - podSelector:
            matchLabels:
              component: kube-apiserver
      ports:
        - protocol: TCP
          port: 443
